name: Build Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - linux-macos
          - windows
          - macos
      static_libpcap:
        description: Statically link libpcap in Linux test artifacts (macOS/Windows unchanged)
        type: boolean
        default: true

concurrency:
  group: flowlens-build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.96.0
  CARGO_ZIGBUILD_VERSION: 0.23.0
  ZIG_VERSION: 0.16.0
  NPCAP_SDK_VERSION: 1.16
  NPCAP_SDK_URL: https://npcap.com/dist/npcap-sdk-1.16.zip
  NPCAP_SDK_SHA256: F0A8BE7778EE3AE1B99BBBECB27A3FF0F6C111A4093F1C78C5C5A099607184DB

jobs:
  metadata:
    name: build-metadata
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.metadata.outputs.short_sha }}
    steps:
      - name: Capture commit identifier
        id: metadata
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build-linux-${{ matrix.arch }}
    if: inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == 'linux-macos'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu.2.28
            target_dir: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu.2.28
            target_dir: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target_dir }}
          key: ${{ runner.os }}-build-test-${{ matrix.arch }}-pcap-${{ inputs.static_libpcap }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-${{ matrix.arch }}-pcap-${{ inputs.static_libpcap }}-rust-${{ env.RUST_VERSION }}-
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes flex bison pkg-config
          if [[ "${{ inputs.static_libpcap }}" != true ]]; then sudo apt-get install --yes libpcap-dev; fi
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked
      - name: Compute native libpcap cache key
        if: inputs.static_libpcap
        id: libpcap-cache-key
        run: echo "key=$(bash scripts/build-linux-release.sh '${{ matrix.target }}' --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Cache native libpcap installation
        if: inputs.static_libpcap
        uses: actions/cache@v6
        with:
          path: target/native/${{ matrix.target_dir }}/install
          key: ${{ steps.libpcap-cache-key.outputs.key }}
      - name: Build Linux distribution binary
        run: |
          if [[ "${{ inputs.static_libpcap }}" == true ]]; then
            bash scripts/build-linux-release.sh "${{ matrix.target }}"
          else
            cargo clean --package pcap --release --target "${{ matrix.target_dir }}"
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
            cp LICENSE "target/${{ matrix.target_dir }}/release/LICENSE"
          fi
      - name: Verify Linux binary baseline
        run: |
          mode=dynamic
          if [[ "${{ inputs.static_libpcap }}" == true ]]; then mode=static; fi
          bash scripts/verify-linux-binary.sh "target/${{ matrix.target_dir }}/release/flowlens" "${{ matrix.arch }}" "$mode"
      - name: Test installer and binary audit fixtures
        run: |
          bash tests/install/test-install.sh
          bash tests/build/test-linux-binary.sh
          bash tests/build/test-macos-binary.sh
          bash tests/build/test-linux-smoke.sh
          bash tests/build/test-libpcap-cache.sh
          python3 tests/build/test-capture-smoke.py
      - name: Capture without system libpcap across distributions
        if: inputs.static_libpcap
        run: |
          set -euo pipefail
          for image in debian:bookworm-slim ubuntu:24.04 quay.io/fedora/fedora:43 quay.io/rockylinux/rockylinux:8; do
            docker run --rm --cap-add NET_RAW -v "$PWD:/work:ro" "$image" bash -c '
              set -euo pipefail
              if command -v apt-get >/dev/null; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 util-linux libcap2-bin
              else
                dnf install -y python3 util-linux libcap
              fi
              cat /etc/os-release
              bash /work/scripts/smoke-linux-release.sh /work/target/${{ matrix.target_dir }}/release/flowlens
            '
          done
      - name: Smoke dynamic Linux binary
        if: ${{ !inputs.static_libpcap }}
        run: |
          binary="$PWD/target/${{ matrix.target_dir }}/release/flowlens"
          "$binary" --help >/dev/null
          sudo -n python3 scripts/smoke-capture.py "$binary" lo
      - name: Package Linux binary
        env:
          BUILD_SHA: ${{ needs.metadata.outputs.short_sha }}
        run: |
          mkdir -p dist
          test -s target/${{ matrix.target_dir }}/release/LICENSE
          tar -C target/${{ matrix.target_dir }}/release \
            -czf "dist/flowlens-${BUILD_SHA}-linux-${{ matrix.arch }}.tar.gz" flowlens LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: flowlens-${{ needs.metadata.outputs.short_sha }}-linux-${{ matrix.arch }}
          path: dist/flowlens-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: build-windows-${{ matrix.arch }}
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            target_dir: x86_64-pc-windows-msvc
            npcap_libdir: x64
            msvc_arch: amd64
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            target_dir: aarch64-pc-windows-msvc
            npcap_libdir: ARM64
            msvc_arch: amd64_arm64
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-build-test-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\npcap-sdk-${{ env.NPCAP_SDK_VERSION }}.zip
          key: ${{ runner.os }}-npcap-sdk-${{ env.NPCAP_SDK_VERSION }}-${{ env.NPCAP_SDK_SHA256 }}
      - name: Prepare Npcap SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "npcap-sdk-$env:NPCAP_SDK_VERSION.zip"
          $extract = Join-Path $env:RUNNER_TEMP "npcap-sdk-$env:NPCAP_SDK_VERSION"
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest -UseBasicParsing -Uri $env:NPCAP_SDK_URL -OutFile $archive
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actual -ne $env:NPCAP_SDK_SHA256) {
            throw "Npcap SDK SHA-256 mismatch: expected $env:NPCAP_SDK_SHA256, got $actual"
          }
          if (Test-Path $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $libdir = Join-Path $extract "Lib\${{ matrix.npcap_libdir }}"
          if (-not (Test-Path (Join-Path $libdir 'wpcap.lib'))) { throw 'wpcap.lib is missing' }
          if (-not (Test-Path (Join-Path $libdir 'Packet.lib'))) { throw 'Packet.lib is missing' }
          "LIBPCAP_LIBDIR=$libdir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build Windows distribution binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify Windows binary dependencies
        shell: pwsh
        run: |
          $binary = 'target\${{ matrix.target_dir }}\release\flowlens.exe'
          if (-not (Test-Path $binary)) { throw 'flowlens.exe is missing' }
          $dependencies = (dumpbin /DEPENDENTS $binary | Out-String)
          if ($dependencies -match 'VCRUNTIME140\.dll|MSVCP140\.dll|api-ms-win-crt') {
            throw 'Windows binary still depends on the dynamic VC Runtime'
          }
          if ($dependencies -notmatch 'wpcap\.dll') {
            throw 'Windows binary does not declare wpcap.dll'
          }
      - name: Package Windows binary
        env:
          BUILD_SHA: ${{ needs.metadata.outputs.short_sha }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath 'LICENSE' -Destination 'target\${{ matrix.target_dir }}\release\LICENSE'
          Compress-Archive -Path 'target\${{ matrix.target_dir }}\release\flowlens.exe', 'target\${{ matrix.target_dir }}\release\LICENSE' -DestinationPath "dist\flowlens-$env:BUILD_SHA-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: flowlens-${{ needs.metadata.outputs.short_sha }}-windows-${{ matrix.arch }}
          path: dist/flowlens-*.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: build-macos-${{ matrix.arch }}
    if: inputs.platform == 'all' || inputs.platform == 'macos' || inputs.platform == 'linux-macos'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      LIBPCAP_LIBDIR: /usr/lib
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            deployment_target: "11.0"
            file_arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            target_dir: aarch64-apple-darwin
          - arch: x86_64
            deployment_target: "10.12"
            file_arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            target_dir: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-test-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-
      - name: Inspect macOS build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcrun --show-sdk-path
          /usr/sbin/tcpdump --version
      - name: Build macOS distribution binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify macOS binary and loopback capture
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target_dir }}/release/flowlens"
          bash scripts/verify-macos-binary.sh "$binary" "${{ matrix.file_arch }}" "$MACOSX_DEPLOYMENT_TARGET"
          sudo -n python3 scripts/smoke-capture.py "$PWD/$binary" lo0
      - name: Package macOS binary
        env:
          BUILD_SHA: ${{ needs.metadata.outputs.short_sha }}
        run: |
          mkdir -p dist
          cp LICENSE "target/${{ matrix.target_dir }}/release/LICENSE"
          tar -C "target/${{ matrix.target_dir }}/release" \
            -czf "dist/flowlens-${BUILD_SHA}-macos-${{ matrix.arch }}.tar.gz" flowlens LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: flowlens-${{ needs.metadata.outputs.short_sha }}-macos-${{ matrix.arch }}
          path: dist/flowlens-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: checksums
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    needs: [metadata, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: flowlens-${{ needs.metadata.outputs.short_sha }}-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          archives=(flowlens-*.tar.gz flowlens-*.zip)
          test "${#archives[@]}" -gt 0
          sha256sum "${archives[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: flowlens-${{ needs.metadata.outputs.short_sha }}-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
