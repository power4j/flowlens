name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump applied to the current Cargo version
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: flowlens-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_BRANCH: ${{ github.ref_name }}
  RUST_VERSION: 1.96.0
  CARGO_EDIT_VERSION: 0.13.13
  CARGO_ZIGBUILD_VERSION: 0.23.0
  ZIG_VERSION: 0.16.0
  NPCAP_SDK_VERSION: 1.16
  NPCAP_SDK_URL: https://npcap.com/dist/npcap-sdk-1.16.zip
  NPCAP_SDK_SHA256: F0A8BE7778EE3AE1B99BBBECB27A3FF0F6C111A4093F1C78C5C5A099607184DB
  NPCAP_RUNTIME_VERSION: 1.88
  NPCAP_RUNTIME_URL: https://npcap.com/dist/npcap-1.88.exe
  NPCAP_RUNTIME_SHA256: A2F4EC1E5EA353FF67EFD24B2EBF081BA44532410FAE8D5E146AF0310AA4F56B

jobs:
  prepare:
    name: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.version.outputs.base_sha }}
      base_version: ${{ steps.version.outputs.base_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Ensure release branch is allowed
        run: |
          test "$RELEASE_BRANCH" = "main"
          git fetch origin "$RELEASE_BRANCH" --tags
          git checkout --detach "origin/$RELEASE_BRANCH"
          test -z "$(git status --porcelain)"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-edit
        run: cargo install cargo-edit --version "$CARGO_EDIT_VERSION" --locked
      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          base_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "flowlens") | .version')"
          cargo set-version --bump "$BUMP"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "flowlens") | .version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          lock_version="$(awk '/name = "flowlens"/ { getline; print $3; exit }' Cargo.lock | tr -d '"')"
          test "$lock_version" = "$version"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          {
            echo "base_sha=$base_sha"
            echo "base_version=$base_version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    name: build-linux-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu.2.28
            target_dir: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu.2.28
            target_dir: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target_dir }}
          key: ${{ runner.os }}-release-${{ matrix.arch }}-static-pcap-v1-rust-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.arch }}-static-pcap-v1-rust-${{ env.RUST_VERSION }}-
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes flex bison pkg-config
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install cargo-edit and cargo-zigbuild
        run: |
          cargo install cargo-edit --version "$CARGO_EDIT_VERSION" --locked
          cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo set-version "$RELEASE_VERSION"
      - name: Compute native libpcap cache key
        id: libpcap-cache-key
        run: echo "key=$(bash scripts/build-linux-release.sh '${{ matrix.target }}' --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Cache native libpcap installation
        uses: actions/cache@v6
        with:
          path: target/native/${{ matrix.target_dir }}/install
          key: ${{ steps.libpcap-cache-key.outputs.key }}
      - name: Build Linux distribution binary
        run: bash scripts/build-linux-release.sh "${{ matrix.target }}"
      - name: Verify Linux binary baseline
        run: bash scripts/verify-linux-binary.sh "target/${{ matrix.target_dir }}/release/flowlens" "${{ matrix.arch }}"
      - name: Test installer and binary audit fixtures
        run: |
          bash tests/install/test-install.sh
          bash tests/build/test-linux-binary.sh
          bash tests/build/test-macos-binary.sh
          bash tests/build/test-linux-smoke.sh
          bash tests/build/test-libpcap-cache.sh
          python3 tests/build/test-capture-smoke.py
      - name: Capture without system libpcap across distributions
        run: |
          set -euo pipefail
          for image in debian:bookworm-slim ubuntu:24.04 quay.io/fedora/fedora:43 quay.io/rockylinux/rockylinux:8; do
            docker run --rm --cap-add NET_RAW -v "$PWD:/work:ro" "$image" bash -c '
              set -euo pipefail
              if command -v apt-get >/dev/null; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 util-linux libcap2-bin
              else
                dnf install -y python3 util-linux libcap
              fi
              cat /etc/os-release
              bash /work/scripts/smoke-linux-release.sh /work/target/${{ matrix.target_dir }}/release/flowlens
            '
          done
      - name: Package Linux binary
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          test -s target/${{ matrix.target_dir }}/release/LICENSE
          tar -C target/${{ matrix.target_dir }}/release \
            -czf "dist/flowlens-v${RELEASE_VERSION}-linux-${{ matrix.arch }}.tar.gz" flowlens LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/flowlens-*.tar.gz
          if-no-files-found: error

  build-windows:
    name: build-windows-${{ matrix.arch }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            target_dir: x86_64-pc-windows-msvc
            npcap_libdir: x64
            msvc_arch: amd64
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            target_dir: aarch64-pc-windows-msvc
            npcap_libdir: ARM64
            msvc_arch: amd64_arm64
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-release-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\npcap-sdk-${{ env.NPCAP_SDK_VERSION }}.zip
          key: ${{ runner.os }}-npcap-sdk-${{ env.NPCAP_SDK_VERSION }}-${{ env.NPCAP_SDK_SHA256 }}
      - name: Cache Npcap runtime installer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\npcap-runtime-${{ env.NPCAP_RUNTIME_VERSION }}.exe
          key: ${{ runner.os }}-npcap-runtime-${{ env.NPCAP_RUNTIME_VERSION }}-${{ env.NPCAP_RUNTIME_SHA256 }}

      - name: Extract Npcap runtime DLLs
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "npcap-runtime-$env:NPCAP_RUNTIME_VERSION.exe"
          if (-not (Test-Path $installer)) {
            Invoke-WebRequest -UseBasicParsing -Uri $env:NPCAP_RUNTIME_URL -OutFile $installer
          }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($actual -ne $env:NPCAP_RUNTIME_SHA256) {
            throw "Npcap runtime SHA-256 mismatch: expected $env:NPCAP_RUNTIME_SHA256, got $actual"
          }
          $sevenZip = @(
            (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source,
            (Join-Path $env:ProgramFiles '7-Zip\7z.exe'),
            (Join-Path ${env:ProgramFiles(x86)} '7-Zip\7z.exe')
          ) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1
          if (-not $sevenZip) {
            throw '7-Zip is required to extract the Npcap runtime DLLs'
          }
          $runtimeDir = Join-Path $env:RUNNER_TEMP "npcap-runtime-$env:NPCAP_RUNTIME_VERSION"
          if (Test-Path $runtimeDir) {
            Remove-Item -LiteralPath $runtimeDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $runtimeDir | Out-Null
          & $sevenZip x $installer 'wpcap_x64.dll' 'Packet_x64.dll' ('-o' + $runtimeDir) '-y'
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract Npcap runtime DLLs with exit code $LASTEXITCODE"
          }
          Move-Item -LiteralPath (Join-Path $runtimeDir 'wpcap_x64.dll') -Destination (Join-Path $runtimeDir 'wpcap.dll')
          Move-Item -LiteralPath (Join-Path $runtimeDir 'Packet_x64.dll') -Destination (Join-Path $runtimeDir 'Packet.dll')
          if (-not (Test-Path (Join-Path $runtimeDir 'wpcap.dll'))) {
            throw 'Npcap runtime wpcap.dll was not found after extraction'
          }
          Write-Host "Using extracted Npcap runtime from $runtimeDir"
          $runtimeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare Npcap SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "npcap-sdk-$env:NPCAP_SDK_VERSION.zip"
          $extract = Join-Path $env:RUNNER_TEMP "npcap-sdk-$env:NPCAP_SDK_VERSION"
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest -UseBasicParsing -Uri $env:NPCAP_SDK_URL -OutFile $archive
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actual -ne $env:NPCAP_SDK_SHA256) {
            throw "Npcap SDK SHA-256 mismatch: expected $env:NPCAP_SDK_SHA256, got $actual"
          }
          if (Test-Path $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $libdir = Join-Path $extract "Lib\${{ matrix.npcap_libdir }}"
          if (-not (Test-Path (Join-Path $libdir 'wpcap.lib'))) { throw 'wpcap.lib is missing' }
          if (-not (Test-Path (Join-Path $libdir 'Packet.lib'))) { throw 'Packet.lib is missing' }
          "LIBPCAP_LIBDIR=$libdir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install cargo-edit
        run: cargo install cargo-edit --version "$env:CARGO_EDIT_VERSION" --locked
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo set-version "$env:RELEASE_VERSION"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Run Windows tests
        if: matrix.arch == 'x86_64'
        run: cargo test --locked
      - name: Build Windows distribution binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify Windows binary dependencies
        shell: pwsh
        run: |
          $binary = 'target\${{ matrix.target_dir }}\release\flowlens.exe'
          if (-not (Test-Path $binary)) { throw 'flowlens.exe is missing' }
          $dependencies = (dumpbin /DEPENDENTS $binary | Out-String)
          if ($dependencies -match 'VCRUNTIME140\.dll|MSVCP140\.dll|api-ms-win-crt') {
            throw 'Windows binary still depends on the dynamic VC Runtime'
          }
          if ($dependencies -notmatch 'wpcap\.dll') {
            throw 'Windows binary does not declare wpcap.dll' 
          }
      - name: Package Windows binary
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath 'LICENSE' -Destination 'target\${{ matrix.target_dir }}\release\LICENSE'
          Compress-Archive -Path 'target\${{ matrix.target_dir }}\release\flowlens.exe', 'target\${{ matrix.target_dir }}\release\LICENSE' -DestinationPath "dist\flowlens-v$env:RELEASE_VERSION-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/flowlens-*.zip
          if-no-files-found: error

  build-macos:
    name: build-macos-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      LIBPCAP_LIBDIR: /usr/lib
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            deployment_target: "11.0"
            file_arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            target_dir: aarch64-apple-darwin
          - arch: x86_64
            deployment_target: "10.12"
            file_arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            target_dir: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.arch }}-rust-${{ env.RUST_VERSION }}-
      - name: Inspect macOS build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcrun --show-sdk-path
          /usr/sbin/tcpdump --version
      - name: Install cargo-edit
        run: cargo install cargo-edit --version "$CARGO_EDIT_VERSION" --locked
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo set-version "$RELEASE_VERSION"
      - name: Build macOS distribution binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify macOS binary and loopback capture
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target_dir }}/release/flowlens"
          bash scripts/verify-macos-binary.sh "$binary" "${{ matrix.file_arch }}" "$MACOSX_DEPLOYMENT_TARGET"
          test "$("$binary" --version)" = "flowlens ${{ needs.prepare.outputs.version }}"
          sudo -n python3 scripts/smoke-capture.py "$PWD/$binary" lo0
      - name: Package macOS binary
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          cp LICENSE "target/${{ matrix.target_dir }}/release/LICENSE"
          tar -C "target/${{ matrix.target_dir }}/release" \
            -czf "dist/flowlens-v${RELEASE_VERSION}-macos-${{ matrix.arch }}.tar.gz" flowlens LICENSE
          test "$(tar -tzf "dist/flowlens-v${RELEASE_VERSION}-macos-${{ matrix.arch }}.tar.gz")" = "$(printf 'flowlens\nLICENSE')"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/flowlens-*.tar.gz
          if-no-files-found: error

  commit:
    name: commit-release-metadata
    needs: [prepare, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify release branch has not changed
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          git fetch origin "$RELEASE_BRANCH" --tags
          git checkout --detach "origin/$RELEASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-edit
        run: cargo install cargo-edit --version "$CARGO_EDIT_VERSION" --locked
      - name: Commit version and tag
        id: commit
        env:
          BUMP: ${{ inputs.bump }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
        run: |
          current_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "flowlens") | .version')"
          test "$current_version" = "$BASE_VERSION"
          cargo set-version --bump "$BUMP"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "flowlens") | .version')"
          test "$version" = "$EXPECTED_VERSION"
          lock_version="$(awk '/name = "flowlens"/ { getline; print $3; exit }' Cargo.lock | tr -d '"')"
          test "$lock_version" = "$version"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$version"
          git tag -a "v$version" -m "Release v$version"
          git push origin "HEAD:$RELEASE_BRANCH"
          git push origin "v$version"
          {
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  draft-release:
    name: create-draft-release
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum flowlens-*.tar.gz flowlens-*.zip > SHA256SUMS
      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: v${{ needs.commit.outputs.version }}
          name: v${{ needs.commit.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
