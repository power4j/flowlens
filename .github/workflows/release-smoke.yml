name: Release smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.3.0
        required: true
      platform:
        description: linux or macos
        required: true
        default: linux
      architecture:
        description: x86_64 or aarch64
        required: true
        default: x86_64

permissions:
  contents: read

jobs:
  linux:
    if: github.event.inputs.platform == 'linux'
    runs-on: ${{ github.event.inputs.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install --yes libpcap0.8
      - name: Install from GitHub Release
        env:
          HOME: ${{ runner.temp }}/flowlens-home
        run: |
          mkdir -p "$HOME"
          bash install.sh --version "${{ github.event.inputs.version }}" --install-dir "${{ runner.temp }}/flowlens-bin"
          "${{ runner.temp }}/flowlens-bin/flowlens" --help
          bash install.sh --uninstall --install-dir "${{ runner.temp }}/flowlens-bin"

  macos:
    if: github.event.inputs.platform == 'macos'
    runs-on: ${{ github.event.inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - name: Download and verify macOS Release archive
        env:
          ARCH: ${{ github.event.inputs.architecture }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          archive="flowlens-${VERSION}-macos-${ARCH}.tar.gz"
          release_url="https://github.com/${REPOSITORY}/releases/download/${VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSLo "$archive" "${release_url}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSLo SHA256SUMS "${release_url}/SHA256SUMS"

          expected="$(awk -v name="$archive" '$2 == name { print $1 }' SHA256SUMS)"
          test -n "$expected"
          actual="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          test "$(tar -tzf "$archive")" = "flowlens"

          mkdir extracted
          tar -xzf "$archive" -C extracted
          file extracted/flowlens | grep -q "${ARCH/aarch64/arm64}"
          otool -L extracted/flowlens | grep -q 'libpcap'
          extracted/flowlens --help >/dev/null
          test "$(extracted/flowlens --version)" = "flowlens ${VERSION#v}"
